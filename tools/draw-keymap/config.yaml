# keymap-drawer config for the DZ60 "caynan" keymap. Used by draw.sh.
# Reference: https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md
draw_config:
  dark_mode: auto            # follow the viewer's light/dark setting (GitHub honours it)
  append_colon_to_layer_header: false
  footer_text: 'Generated by tools/draw-keymap/draw.sh with keymap-drawer'
  svg_extra_style: |
    /* reset (QK_BOOT): red, so it is never pressed by accident */
    rect.reset { fill: #f8d7da; stroke: #d1242f; }
    @media (prefers-color-scheme: dark) { rect.reset { fill: #5c1d22; stroke: #ff7b72; } }
    /* keys that do nothing on this layer (KC_NO): hatched-looking dashed outline */
    rect.none { stroke-dasharray: 2, 3; opacity: 0.55; }

parse_config:
  trans_legend: {t: '▽', type: trans}
  # Whole raw bindings (as `qmk c2json` prints them) to legends. Anything not listed falls back
  # to keymap-drawer's own parsing: KC_ prefix stripped, MO/LT drawn as layer keys. LT keys are
  # left to the parser on purpose: mapping them here would lose the highlight of the held key on
  # the layer they open. draw.sh renames their tap legends (SPC, ENT) afterwards instead.
  raw_binding_map:
    KC_NO: {t: '', type: none}
    QK_BOOT: {t: Boot, type: reset}
    # Tap-hold and Space Cadet keys
    ALL_T(KC_ESC): {t: Esc, h: Hyper}
    SC_LSPO: {t: '(', h: Shift}
    SC_RSPC: {t: ')', h: Shift}
    # Names as printed on a Mac keyboard
    KC_ESC: Esc
    KC_BSPC: Bksp
    KC_TAB: Tab
    KC_ENT: Enter
    KC_SPC: Space
    KC_LCTL: Ctrl
    KC_LALT: Opt
    KC_RALT: Opt
    KC_LGUI: Cmd
    KC_RGUI: Cmd
    KC_UP: '↑'
    KC_DOWN: '↓'
    KC_LEFT: '←'
    KC_RGHT: '→'
    KC_PSCR: PrtSc
    # Media
    KC_MPLY: Play
    KC_MPRV: Prev
    KC_MNXT: Next
    KC_VOLU: Vol+
    KC_VOLD: Vol-
    KC_MUTE: Mute
    # Mouse keys
    MS_BTN1: {t: Click, h: left}
    MS_BTN2: {t: Click, h: right}
    MS_UP: {t: '↑', h: mouse}
    MS_DOWN: {t: '↓', h: mouse}
    MS_LEFT: {t: '←', h: mouse}
    MS_RGHT: {t: '→', h: mouse}
    MS_WHLU: {t: '↑', h: wheel}
    MS_WHLD: {t: '↓', h: wheel}
